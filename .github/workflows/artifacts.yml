name : Build and Store Artifacts

on : [push]

jobs:       #two jobs - build and download
  build:
    runs-on : ubuntu-latest
    steps:
      - name : checkout code
        uses : actions/checkout@v3

      - name : build project
        run : /
          mkdir -p output
          echo "Hello world" > output/artifact.txt
          ls -l output #Debugging: List contents
          cat output/artifact.txt #Debugging : show file content

      - name : Upload artifact
        uses : action/upload-artifact@v4
        with : 
        name : my-artifact
        path : output/


  download:
    runs-on : ubuntu-latest
    needs : build
    steps:
      - name : Download artifact from github Actions
        uses : actions/download-artifact@v4 #Pattern: actions/  _______@___
        with : 
          name : my-artifact
          path : downloaded-artifact

      - name : Display artifact content
        run : |
          ls -l downloaded-artifact
          cat downloaded-artifact/artifact.txt || echo "File is empty or missing"
